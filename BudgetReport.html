<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <style>html{visibility:hidden}</style>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Budget Report</title>
  <style>
    :root{ --primary:#1a4f8b; --secondary:#2e8b57; --bg:#f5f5f5; --card:#fff; --danger:#dc3545; }
    body{ margin:0; padding:12px; font-family:Arial,sans-serif; background:var(--bg); font-size:12px; }

    .header{
      display:flex; justify-content:space-between; align-items:center;
      background:linear-gradient(135deg,var(--primary),var(--secondary));
      padding:10px 14px; border-radius:10px; box-shadow:0 2px 4px rgba(0,0,0,.1); margin-bottom:14px;
    }
    .header-text{ text-align:center; flex-grow:1; color:#fff; }
    .header-text h1{ margin:3px 0; font-size:14px; }
    .header-text h2{ margin:2px 0; font-size:12px; }
    .logo{ width:70px; height:70px; background:#fff; border-radius:5px; padding:4px; display:flex; justify-content:center; align-items:center; margin-right:12px; }
    .logo img{ width:100%; height:100%; object-fit:contain; }

    .card{ background:var(--card); border-radius:10px; box-shadow:0 1px 3px rgba(0,0,0,.12); padding:12px; margin-bottom:12px; }
    .field-row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
    .field-row label{ font-weight:700; min-width:100px; color:#334155; }
    .btn-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }

    input,select,button{ padding:6px 10px; border:1px solid #ddd; border-radius:6px; font-size:12px; }
    button{ background:var(--primary); color:#fff; border:none; cursor:pointer; font-weight:700; transition:background-color .2s; }
    button:hover{ background:var(--secondary); }
    .btn-green{ background:#28a745; } .btn-green:hover{ background:#218838; }
    .btn-orange{ background:#d97706; } .btn-orange:hover{ background:#b45309; }
    .hint{ color:#666; font-size:11px; }

    /* Summary cards */
    .area-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; margin-top:8px; }
    .area-card{
      background:#fff; border-radius:10px; border:1px solid #e2e8f0;
      box-shadow:0 1px 4px rgba(0,0,0,.08); padding:12px; position:relative;
    }
    .area-card h3{ margin:0 0 10px; font-size:13px; color:var(--primary); border-bottom:2px solid var(--primary); padding-bottom:4px; }
    .area-card .metric-row{ display:flex; justify-content:space-between; align-items:center; padding:4px 0; border-bottom:1px solid #f1f5f9; }
    .area-card .metric-row:last-child{ border-bottom:none; }
    .area-card .metric-label{ color:#64748b; font-size:11px; }
    .area-card .metric-val{ font-weight:700; font-size:13px; }
    .area-card .remaining.positive{ color:#16a34a; }
    .area-card .remaining.negative{ color:#dc2626; }
    .area-card .remaining.zero{ color:#d97706; }

    /* Detail table */
    .detail-table{ width:100%; border-collapse:collapse; margin-top:8px; font-size:11px; }
    .detail-table th,
    .detail-table td{ border:1px solid #e5e7eb; padding:5px 8px; text-align:left; }
    .detail-table th{ background:var(--primary); color:#fff; }
    .detail-table tr:nth-child(even){ background:#f8fafc; }
    .detail-table td.num{ text-align:right; font-variant-numeric:tabular-nums; }
    .detail-table .ot-row td{ background:#fff7ed; }

    .no-data{ padding:30px; text-align:center; color:#888; font-size:13px; }

    .status-message{
      position:fixed; top:18px; right:18px; padding:10px 16px; border-radius:6px;
      color:#fff; display:none; z-index:1000; max-width:520px; white-space:nowrap;
      overflow:hidden; text-overflow:ellipsis; box-shadow:0 4px 12px rgba(0,0,0,.18); font-size:12px;
    }
    .status-success{ background:#28a745; }
    .status-error{ background:#dc3545; }
    .status-info{ background:#2563eb; }

    /* ── Release picker modal ── */
    .rel-modal-backdrop{
      position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:1100; display:flex; align-items:center; justify-content:center;
    }
    .rel-modal{
      background:#fff; border-radius:12px; box-shadow:0 8px 32px rgba(0,0,0,.22);
      width:min(500px,95vw); max-height:80vh; display:flex; flex-direction:column; overflow:hidden;
    }
    .rel-modal-head{
      background:linear-gradient(135deg,#1a4f8b,#2e8b57); color:#fff; padding:12px 16px;
      font-weight:700; font-size:13px; display:flex; justify-content:space-between; align-items:center;
    }
    .rel-modal-close{ cursor:pointer; font-size:18px; line-height:1; background:none; border:none; color:#fff; padding:0 4px; }
    .rel-modal-body{ overflow-y:auto; padding:10px 12px; flex:1; }
    .rel-item{
      display:flex; justify-content:space-between; align-items:center;
      padding:9px 12px; border:1px solid #e5e7eb; border-radius:8px; margin-bottom:7px; cursor:pointer;
      transition:background .15s;
    }
    .rel-item:hover{ background:#eff6ff; border-color:#bfdbfe; }
    .rel-item-name{ font-weight:700; font-size:12px; color:#1a4f8b; }
    .rel-item-meta{ font-size:11px; color:#666; margin-top:2px; }
    .rel-item-btn{ background:#1a4f8b; color:#fff; border:none; border-radius:6px; padding:5px 12px; font-size:11px; cursor:pointer; white-space:nowrap; }
    .rel-item-btn:hover{ background:#2e8b57; }
    .rel-empty{ padding:20px; text-align:center; color:#888; font-size:12px; }

    @media print{
      @page{ size:landscape; margin:10mm; }
      .no-print{ display:none !important; }
      body{ background:#fff; padding:0; }
      .card{ box-shadow:none; border:1px solid #ccc; margin-bottom:8px; }
      .header{ box-shadow:none; border-radius:0; margin-bottom:8px; }
      .area-grid{ grid-template-columns:repeat(3,1fr); gap:8px; }
      .area-card{ box-shadow:none; border:1px solid #999; }
      *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="logo">
    <img src="MNGHA-Logo.png" alt="MNGHA Logo"
      onerror="this.src='data:image/svg+xml;charset=UTF-8,<svg xmlns=&quot;http://www.w3.org/2000/svg&quot; width=&quot;70&quot; height=&quot;70&quot;><rect width=&quot;70&quot; height=&quot;70&quot; fill=&quot;%23f0f0f0&quot;/><text x=&quot;50%25&quot; y=&quot;50%25&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; dy=&quot;.3em&quot;>Logo</text></svg>';">
  </div>
  <div class="header-text">
    <h1>Ministry of National Guard Health Affairs</h1>
    <h2>KAMC-WR — Pharmaceutical Care Department</h2>
    <h2>OT Budget Report</h2>
  </div>
</div>

<!-- Controls -->
<div class="card no-print">
  <div class="field-row">
    <label>Month</label>
    <select id="monthSelect">
      <option value="1">January</option><option value="2">February</option><option value="3">March</option>
      <option value="4">April</option><option value="5">May</option><option value="6">June</option>
      <option value="7">July</option><option value="8">August</option><option value="9">September</option>
      <option value="10">October</option><option value="11">November</option><option value="12">December</option>
    </select>
    <label>Year</label>
    <input type="number" id="yearInput" value="2026" style="width:80px"/>
    <label>Rota Area</label>
    <select id="areaSelect" style="min-width:130px">
      <option value="ALL">All Areas</option>
    </select>
  </div>
  <div class="btn-row" style="margin-top:6px;">
    <button class="btn-green" onclick="generateReport()">Load &amp; Generate Report</button>
    <button style="background:#6f42c1;" onmouseover="this.style.background='#5a35a1'" onmouseout="this.style.background='#6f42c1'" onclick="pickRelease()">Pick Release</button>
    <button class="btn-orange" onclick="window.print()">Print Report</button>
    <a href="index.html" style="text-decoration:none;margin-left:auto">
      <button type="button">Back to Rota</button>
    </a>
  </div>
</div>

<!-- Results -->
<div id="reportOutput">
  <div class="card"><div class="no-data">Select month and area, then click "Load &amp; Generate Report".</div></div>
</div>

<div class="status-message" id="statusBox"></div>
