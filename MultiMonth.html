<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <style>html{visibility:hidden}</style>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Multi-Month Rota View</title>
  <style>
    :root{ --primary:#1a4f8b; --secondary:#2e8b57; --bg:#f3f6fb; --card:#fff; }
    *{ box-sizing:border-box; }
    body{ margin:0; padding:12px; font-family:Arial,sans-serif; background:var(--bg); font-size:12px; color:#1f2937; }

    .header{
      background:linear-gradient(135deg,var(--primary),var(--secondary));
      color:#fff; padding:12px 16px; border-radius:12px;
      box-shadow:0 2px 8px rgba(0,0,0,.12); margin-bottom:14px;
      display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
    }
    .header h1{ margin:0; font-size:14px; font-weight:800; }
    .header h2{ margin:2px 0 0; font-size:12px; opacity:.9; }
    .logo{ width:64px; height:64px; background:#fff; border-radius:6px; padding:4px; display:flex; justify-content:center; align-items:center; flex-shrink:0; }
    .logo img{ width:100%; height:100%; object-fit:contain; }

    .card{ background:var(--card); border-radius:12px; box-shadow:0 1px 4px rgba(0,0,0,.10); padding:12px; margin-bottom:12px; border:1px solid #e7edf3; }
    .row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    label{ font-weight:700; color:#334155; }
    input,select{ padding:6px 10px; border:1px solid #d9e2ec; border-radius:8px; font-size:12px; background:#fff; }
    button{ padding:7px 14px; border:none; border-radius:8px; font-size:12px; font-weight:700; cursor:pointer; background:var(--primary); color:#fff; transition:background .2s; }
    button:hover{ background:#163a5a; }
    .btn-green{ background:#16a34a; } .btn-green:hover{ background:#15803d; }
    .btn-orange{ background:#d97706; } .btn-orange:hover{ background:#b45309; }
    .hint{ color:#6b7280; font-size:11px; }

    .status-message{ position:fixed; top:16px; right:16px; padding:10px 18px; border-radius:8px; color:#fff; display:none; z-index:2000; max-width:600px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; box-shadow:0 4px 12px rgba(0,0,0,.18); font-size:12px; }
    .status-success{ background:#16a34a; } .status-error{ background:#dc2626; } .status-info{ background:#2563eb; }

    /* Table */
    .table-outer{ overflow-x:auto; border-radius:12px; box-shadow:0 1px 4px rgba(0,0,0,.10); border:1px solid #e7edf3; background:#fff; }
    table{ border-collapse:collapse; min-width:100%; }
    th,td{ border:1px solid #ddd; padding:3px 4px; text-align:center; font-size:10px; white-space:nowrap; }
    thead th{ background:var(--primary); color:#fff; position:sticky; top:0; z-index:3; }
    .th-month{ background:#0f3460; font-size:11px; font-weight:800; }
    .th-day{ background:#1a4f8b; font-size:10px; font-weight:600; }
    .th-weekend{ background:#2d6a9f; }
    .td-name{ text-align:left; font-weight:700; background:#f9fbfd; position:sticky; left:0; z-index:2; min-width:160px; padding:3px 8px; border-right:2px solid #1a4f8b; }
    .td-weekend{ background:#f3f3f3; }
    .td-empty{ background:#fff; }
    .td-duty{ color:#fff; font-weight:700; font-size:10px; }
    td[data-dlen="4"]{ font-size:9px; }
    td[data-dlen="5"]{ font-size:8px; }
    td[data-dlen="6"]{ font-size:7.5px; }
    td[data-dlen="7"]{ font-size:7px; }
    td[data-dlen="8"]{ font-size:6.5px; }
    .month-sep{ border-left:3px solid #0f3460 !important; }

    .progress-bar{ height:6px; background:#e5e7eb; border-radius:4px; overflow:hidden; margin-top:4px; }
    .progress-fill{ height:100%; background:var(--secondary); border-radius:4px; transition:width .3s; }

    @media print{
      @page{ size:landscape; margin:8mm; }
      body{ padding:0; background:#fff; }
      .no-print{ display:none !important; }
      .card{ box-shadow:none; border:1px solid #ddd; }
      th,td{ padding:2px; font-size:7pt; border:.5pt solid #000; }
      .td-name{ position:static; }
      thead th{ position:static; }
      *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
    }
  </style>
</head>
<body>

  <div class="header no-print">
    <div class="logo">
      <img src="MNGHA-Logo.png" alt="Logo"
        onerror="this.src='data:image/svg+xml;charset=UTF-8,<svg xmlns=&quot;http://www.w3.org/2000/svg&quot; width=&quot;64&quot; height=&quot;64&quot;><rect width=&quot;64&quot; height=&quot;64&quot; fill=&quot;%23f0f0f0&quot;/><text x=&quot;50%25&quot; y=&quot;50%25&quot; font-size=&quot;10&quot; text-anchor=&quot;middle&quot; dy=&quot;.3em&quot;>Logo</text></svg>';">
    </div>
    <div style="flex:1;">
      <h1>Ministry of National Guard Health Affairs</h1>
      <h2>KAMC-WR — Pharmaceutical Care Department — Multi-Month Rota</h2>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
      <button class="btn-green" onclick="window.print()">🖨 Print</button>
      <a href="index.html" style="text-decoration:none;"><button type="button">← Rota</button></a>
    </div>
  </div>

  <!-- Controls -->
  <div class="card no-print">
    <div class="row" style="gap:14px;">
      <div class="row">
        <label>Area:</label>
        <select id="mmArea"></select>
      </div>
      <div class="row">
        <label>Year:</label>
        <input type="number" id="mmYear" value="2026" min="2020" max="2040" style="width:80px;"/>
      </div>
      <div class="row">
        <label>From:</label>
        <select id="mmStart">
          <option value="1">January</option><option value="2">February</option><option value="3">March</option>
          <option value="4">April</option><option value="5" selected>May</option><option value="6">June</option>
          <option value="7">July</option><option value="8">August</option><option value="9">September</option>
          <option value="10">October</option><option value="11">November</option><option value="12">December</option>
        </select>
      </div>
      <div class="row">
        <label>To:</label>
        <select id="mmEnd">
          <option value="1">January</option><option value="2">February</option><option value="3">March</option>
          <option value="4">April</option><option value="5">May</option><option value="6" selected>June</option>
          <option value="7">July</option><option value="8">August</option><option value="9">September</option>
          <option value="10">October</option><option value="11">November</option><option value="12">December</option>
        </select>
      </div>
      <button onclick="loadMultiMonth()">📅 Load</button>
      <button class="btn-orange" onclick="exportMultiMonthExcel()">📊 Export Excel</button>
    </div>
    <div class="hint" style="margin-top:6px;">Loads monthly rotas already saved from the main Rota page. Each month must be saved first using 💾 Save.</div>
  </div>

  <!-- Summary bar -->
  <div id="summaryBar" style="display:none;" class="card no-print">
    <div id="summaryContent" class="row" style="gap:16px;flex-wrap:wrap;"></div>
  </div>

  <!-- Table -->
  <div class="table-outer" id="tableOuter" style="display:none;">
    <table id="mmTable"></table>
  </div>

  <div class="status-message" id="statusBox"></div>

  <script src="config.js"></script>
  <script src="js/version-check.js"></script>
  <script src="js/auth.js?v=13"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
    const app = initializeApp({
      apiKey:"AIzaSyDA9hjUxU_DlArK6UIOdfS0PavTgNsUBbw",
      authDomain:"bcotrota.firebaseapp.com", projectId:"bcotrota",
      storageBucket:"bcotrota.firebasestorage.app",
      messagingSenderId:"659421824894",
      appId:"1:659421824894:web:f0546879df8808491ad52f"
    });
    const db = getFirestore(app);
    window.FB = { db, doc, getDoc };
  </script>

  <script src="js/multimonth.js"></script>
</body>
</html>
