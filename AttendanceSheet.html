<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <style>html{visibility:hidden}</style>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Attendance Sheet</title>
  <style>
    :root{ --primary:#1a4f8b; --secondary:#2e8b57; }
    body{ margin:0; padding:12px; font-family:Arial,sans-serif; background:#f5f5f5; font-size:12px; }

    /* ── Controls bar (no-print) ── */
    .controls-bar{
      background:#fff; border-radius:10px; box-shadow:0 1px 4px rgba(0,0,0,.12);
      padding:12px 16px; margin-bottom:14px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;
    }
    .controls-bar label{ font-weight:700; color:#334155; white-space:nowrap; }
    input,select,button{ padding:6px 10px; border:1px solid #ddd; border-radius:6px; font-size:12px; }
    button{ background:var(--primary); color:#fff; border:none; cursor:pointer; font-weight:700; }
    button:hover{ background:var(--secondary); }
    .btn-green{ background:#28a745; } .btn-green:hover{ background:#218838; }
    .btn-orange{ background:#d97706; } .btn-orange:hover{ background:#b45309; }

    /* ── Form wrapper ── */
    .form-wrapper{
      background:#fff; padding:20px 24px 16px; border-radius:6px;
      box-shadow:0 1px 6px rgba(0,0,0,.1); max-width:1200px; margin:0 auto;
    }

    /* ── Page section ── */
    .print-page{ }
    .print-page.page-break-after{
      border-bottom:3px dashed #cbd5e1;
      margin-bottom:32px;
      padding-bottom:24px;
    }

    /* ── Title block ── */
    .form-title{ text-align:center; margin-bottom:14px; }
    .form-title .main-title{ font-size:14px; font-weight:900; text-transform:uppercase; letter-spacing:.4px; margin-bottom:4px; }
    .form-title .sub-title{ font-size:12px; font-weight:400; line-height:1.6; }

    /* ── Meta fields ── */
    .meta-section{ margin-bottom:10px; }
    .meta-row{
      display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:0 16px;
      margin-bottom:5px; align-items:baseline;
    }
    .meta-cell{ display:flex; align-items:baseline; gap:5px; font-size:11px; }
    .meta-cell b{ white-space:nowrap; font-weight:700; }
    .meta-cell .meta-val{
      flex:1; border:none; border-bottom:1px solid #333; border-radius:0;
      padding:1px 4px; font-size:11px; font-family:Arial,sans-serif;
      background:transparent; outline:none; min-width:40px;
    }
    .meta-cell .meta-val:focus{ background:#fffde7; }
    .week-label{ text-align:center; font-weight:700; font-size:11.5px; color:#1a4f8b; margin:6px 0 8px; }

    /* ── Attendance grid ── */
    .att-table{ width:100%; border-collapse:collapse; border:1px solid #333; margin-top:4px; table-layout:fixed; }
    .att-table th{
      background:#ffd700; color:#000; font-weight:700; font-size:8.5px;
      border:1px solid #333; padding:2px; text-align:center; line-height:1.2;
    }
    .att-table td{
      border:1px solid #333; padding:2px; font-size:8.5px; vertical-align:middle; text-align:center;
    }
    .att-table td.name-cell input{ text-align:left; font-weight:700; }
    .att-table input{
      width:100%; border:none; background:transparent; font-size:8.5px; text-align:center;
      font-family:Arial,sans-serif; outline:none; padding:0;
    }
    .att-table input:focus{ background:#fffde7; }
    .att-table td.subrow-label{ font-size:7.5px; color:#666; text-align:right; padding-right:3px; background:#fafafa; }
    .att-table td.day-on{ background:#ccffcc; }

    /* ── Legend ── */
    .legend-bar{
      display:flex; gap:16px; flex-wrap:wrap; margin-top:8px; font-size:9px; color:#374151;
    }
    .legend-bar b{ color:#111; }
    .submit-note{ font-size:8px; color:#666; margin-top:6px; font-style:italic; }
    .noted-by-line{ font-size:9px; color:#333; margin-top:10px; display:flex; align-items:baseline; gap:5px; }
    .noted-by-line input{ border:none; border-bottom:1px solid #333; background:transparent; font-family:Arial,sans-serif; font-size:9px; padding:1px 4px; }
    .noted-by-line .sig-blank{ flex:1; min-width:80px; border-bottom:1px solid #333; }

    /* ── Footer ── */
    .form-footer{
      display:flex; align-items:baseline;
      margin-top:12px; font-size:8pt; color:#666;
      border-top:1px solid #e5e7eb; padding-top:5px;
    }
    .ff-left  { flex:1; text-align:left; }
    .ff-center{ flex:1; text-align:center; font-size:7.5pt; color:#aaa; }
    .ff-right { flex:1; text-align:right; }

    /* ── Status ── */
    .status-message{
      position:fixed; top:14px; right:14px; padding:10px 16px; border-radius:6px;
      color:#fff; display:none; z-index:999; font-size:12px; font-weight:700;
    }
    .status-ok{ background:#28a745; } .status-err{ background:#dc3545; }

    /* ── PRINT ── */
    @media print{
      @page{ size:A4 landscape; margin:10mm 8mm; }
      body{ background:#fff; padding:0; }
      .controls-bar{ display:none !important; }
      .form-wrapper{ box-shadow:none; padding:0; max-width:100%; border-radius:0; }

      .print-page.page-break-after{
        page-break-after:always;
        border-bottom:none;
        margin-bottom:0;
        padding-bottom:0;
      }

      .form-title .main-title{ font-size:12.5pt; }
      .form-title .sub-title{ font-size:9.5pt; }
      .meta-cell{ font-size:8.5pt; }
      .meta-cell .meta-val{ border-bottom:1px solid #333 !important; }
      .att-table th, .att-table td{ font-size:7pt; }
      *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
    }
  </style>
</head>
<body>

<!-- Controls bar -->
<div class="controls-bar">
  <label>Month</label>
  <select id="monthSel">
    <option value="1">January</option><option value="2">February</option><option value="3">March</option>
    <option value="4">April</option><option value="5">May</option><option value="6">June</option>
    <option value="7">July</option><option value="8">August</option><option value="9">September</option>
    <option value="10">October</option><option value="11">November</option><option value="12">December</option>
  </select>
  <label>Year</label>
  <input type="number" id="yearSel" value="2026" style="width:76px"/>
  <label>Rota Area</label>
  <select id="areaSel" style="min-width:120px">
    <option value="ALL">All Areas</option>
  </select>
  <label title="Employee rows per printed page">Rows/Page</label>
  <input type="number" id="rowsPage" value="8" min="2" max="20" style="width:56px"/>
  <button class="btn-green" onclick="loadAndBuild()">Load &amp; Build Sheets</button>
  <button class="btn-orange" onclick="window.print()">🖨 Print</button>
  <a href="index.html" style="text-decoration:none;margin-left:auto">
    <button type="button">← Back to Rota</button>
  </a>
</div>

<!-- Form wrapper — rebuilt by buildForm() each time data is loaded -->
<div class="form-wrapper" id="formWrapper">
  <div class="form-title">
    <div class="main-title">Attendance Sheet</div>
    <div class="sub-title">
      Kingdom of Saudi Arabia<br>
      Ministry of National Guard - Health Affairs
    </div>
  </div>
  <div style="text-align:center;color:#888;padding:30px;">
    Click "Load &amp; Build Sheets" to generate one weekly attendance sheet per week of the selected month.
  </div>
</div>

<div class="status-message" id="statusBox"></div>
