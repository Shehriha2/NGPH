<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OT Adjustment &amp; Disclosure</title>
  <style>
    :root{ --primary:#1a4f8b; --secondary:#2e8b57; --danger:#dc2626; --warn:#d97706; }
    *{ box-sizing:border-box; }
    body{ margin:0; padding:12px; font-family:Arial,sans-serif; background:#f1f5f9; font-size:13px; color:#1e293b; }

    /* ── Controls bar ── */
    .controls-bar{
      background:#fff; border-radius:10px; box-shadow:0 1px 4px rgba(0,0,0,.12);
      padding:10px 16px; margin-bottom:14px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;
    }
    .page-badge{
      background:linear-gradient(135deg,#1a4f8b,#0f766e); color:#fff; font-weight:800;
      font-size:13px; padding:6px 16px; border-radius:20px; letter-spacing:.3px; white-space:nowrap;
    }
    .controls-bar label{ font-weight:700; color:#334155; white-space:nowrap; }
    select,input[type="number"],input[type="text"],textarea{
      padding:6px 10px; border:1px solid #d1d5db; border-radius:6px; font-size:13px; outline:none;
      font-family:Arial,sans-serif;
    }
    select:focus,input:focus,textarea:focus{ border-color:var(--primary); box-shadow:0 0 0 2px rgba(26,79,139,.15); }
    button{
      padding:7px 14px; border:none; border-radius:7px; font-size:13px; font-weight:700;
      cursor:pointer; background:var(--primary); color:#fff; transition:background .15s;
    }
    button:hover{ background:#163e70; }
    .btn-green{ background:var(--secondary); }  .btn-green:hover{ background:#257a4a; }
    .btn-orange{ background:var(--warn); }      .btn-orange:hover{ background:#b45309; }
    .btn-red{ background:var(--danger); }       .btn-red:hover{ background:#b91c1c; }
    .btn-ghost{ background:#e2e8f0; color:#334155; } .btn-ghost:hover{ background:#cbd5e1; }

    /* ── Layout ── */
    .main-layout{ display:flex; gap:14px; align-items:flex-start; }
    .left-panel{ flex:0 0 360px; display:flex; flex-direction:column; gap:14px; }
    .right-panel{ flex:1; min-width:0; }
    @media(max-width:820px){ .main-layout{ flex-direction:column; } .left-panel{ flex:none; width:100%; } }

    /* ── Card ── */
    .card{
      background:#fff; border-radius:12px; box-shadow:0 1px 4px rgba(0,0,0,.09);
      border:1px solid #e2e8f0; padding:18px 20px;
    }
    .card h3{ margin:0 0 14px; font-size:14px; color:var(--primary); border-bottom:2px solid #e7edf3; padding-bottom:8px; }

    /* ── Search ── */
    .search-row{ display:flex; gap:7px; }
    .search-row input{ flex:1; }

    /* ── Staff info card ── */
    #staffCard{ margin-top:14px; padding:14px; background:#f8fafc; border-radius:10px; border:1px solid #e2e8f0; }
    .sc-name{ font-size:16px; font-weight:800; color:#0f172a; margin-bottom:4px; }
    .sc-row{ display:flex; gap:6px; align-items:center; margin-top:6px; font-size:12px; color:#475569; }
    .sc-label{ font-weight:700; color:#64748b; min-width:60px; }
    .area-chip{
      background:#dbeafe; color:#1e40af; font-size:11px; font-weight:700;
      padding:2px 8px; border-radius:12px; white-space:nowrap;
    }
    .ot-pill{
      display:inline-block; background:#fef9c3; color:#92400e; font-size:13px; font-weight:800;
      padding:4px 12px; border-radius:20px; margin-top:10px; border:1px solid #fde68a;
    }
    .ot-pill.none{ background:#f1f5f9; color:#64748b; border-color:#e2e8f0; }

    /* ── Adjustment form ── */
    .form-group{ margin-bottom:14px; }
    .form-group label{ display:block; font-size:12px; font-weight:700; color:#374151; margin-bottom:5px; text-transform:uppercase; letter-spacing:.4px; }
    .form-group input[type="number"]{ width:100%; }
    .form-group textarea{ width:100%; resize:vertical; min-height:80px; line-height:1.5; }
    .submit-btn{ width:100%; padding:10px; font-size:14px; letter-spacing:.3px; }

    /* ── Log table ── */
    .log-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
    .log-header h3{ margin:0; font-size:14px; color:var(--primary); }
    .log-summary{ font-size:12px; color:#64748b; }
    .table-wrap{ overflow-x:auto; }
    table.adj-table{ width:100%; border-collapse:collapse; font-size:12px; }
    .adj-table th{
      background:#1a4f8b; color:#fff; padding:8px 10px; text-align:left; font-size:11px;
      white-space:nowrap; position:sticky; top:0;
    }
    .adj-table td{ padding:7px 10px; border-bottom:1px solid #f1f5f9; vertical-align:top; }
    .adj-table tbody tr:hover{ background:#f8fafc; }
    .adj-table tbody tr:last-child td{ border-bottom:none; }
    .hours-cell{ font-weight:800; color:#166534; white-space:nowrap; }
    .notes-cell{ max-width:220px; color:#374151; word-break:break-word; }
    .remarks-cell{ max-width:180px; color:#475569; font-style:italic; word-break:break-word; }
    .ts-cell{ white-space:nowrap; color:#64748b; font-size:11px; }
    .by-cell{ white-space:nowrap; font-size:11px; color:#475569; }
    .empty-log{ padding:40px; text-align:center; color:#94a3b8; font-size:13px; }
    .action-btns{ display:flex; gap:5px; white-space:nowrap; }
    .action-btns button{ padding:3px 9px; font-size:11px; font-weight:700; border-radius:5px; }
    .btn-teal{ background:#0f766e; } .btn-teal:hover{ background:#0b5c56; }
    .adj-table tbody tr.done-row td{ background:#f0fdf4; }
    .done-chip{ display:inline-block; background:#166534; color:#fff; font-size:10px; font-weight:700; padding:2px 7px; border-radius:10px; margin-left:6px; vertical-align:middle; }

    /* ── Edit modal ── */
    #editModal{
      position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:9000;
      display:none; align-items:center; justify-content:center;
    }
    #editModal.show{ display:flex; }
    .edit-modal-box{
      background:#fff; border-radius:14px; box-shadow:0 20px 60px rgba(0,0,0,.3);
      width:min(500px,96%); max-height:90vh; overflow-y:auto;
    }
    .edit-modal-header{
      background:linear-gradient(135deg,#1a4f8b,#0f766e); color:#fff;
      padding:13px 18px; border-radius:14px 14px 0 0;
      display:flex; align-items:center; justify-content:space-between;
    }
    .edit-modal-header span{ font-size:14px; font-weight:700; }
    .edit-modal-header button{
      background:transparent; border:none; color:#fff; font-size:20px;
      cursor:pointer; line-height:1; padding:0 4px;
    }
    .edit-modal-body{ padding:20px; }
    .edit-modal-body .form-group:last-of-type{ margin-bottom:0; }
    .edit-modal-footer{
      padding:12px 20px 16px; border-top:1px solid #f3f4f6;
      display:flex; gap:8px; justify-content:flex-end;
    }

    /* ── Status ── */
    .status-message{
      position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
      padding:10px 22px; border-radius:10px; font-weight:700; font-size:13px;
      box-shadow:0 4px 16px rgba(0,0,0,.18); display:none; z-index:8000; max-width:90vw; text-align:center;
    }
    .status-ok{ background:#166534; color:#fff; display:block !important; }
    .status-err{ background:var(--danger); color:#fff; display:block !important; }

    /* ── Auth overlay ── */
    #authOverlay{
      position:fixed; inset:0; background:#f1f5f9; z-index:9999;
      display:flex; align-items:center; justify-content:center; font-family:Arial,sans-serif;
    }

    /* ── Print ── */
    @media print{ .controls-bar,.no-print{ display:none !important; } }
  </style>
</head>
<body>

<div id="authOverlay">
  <div style="text-align:center;color:#64748b;font-size:14px;">
    <div style="font-size:36px;margin-bottom:12px;">🔑</div>
    Verifying access…
  </div>
</div>

<!-- Controls bar -->
<div class="controls-bar no-print">
  <span class="page-badge">📋 OT Adjustment &amp; Disclosure</span>
  <label>Month</label>
  <select id="monthSel">
    <option value="1">January</option><option value="2">February</option><option value="3">March</option>
    <option value="4">April</option><option value="5">May</option><option value="6">June</option>
    <option value="7">July</option><option value="8">August</option><option value="9">September</option>
    <option value="10">October</option><option value="11">November</option><option value="12">December</option>
  </select>
  <label>Year</label>
  <input type="number" id="yearSel" value="2026" style="width:76px"/>
  <button onclick="refreshLog()" class="btn-ghost">🔄 Refresh Log</button>
  <a href="index.html" style="text-decoration:none;margin-left:auto;">
    <button type="button" class="btn-ghost">← Back to Rota</button>
  </a>
</div>

<!-- Main layout -->
<div class="main-layout">

  <!-- Left panel: Lookup + Form -->
  <div class="left-panel">

    <!-- Staff lookup -->
    <div class="card">
      <h3>🔍 Staff Lookup</h3>
      <div class="search-row">
        <input type="text" id="staffSearch" placeholder="Badge number or staff name…"
          onkeydown="if(event.key==='Enter')searchStaff()"/>
        <button onclick="searchStaff()">Search</button>
      </div>
      <div id="staffCard" style="display:none;"></div>
    </div>

    <!-- Adjustment form -->
    <div class="card" id="adjFormCard" style="display:none;">
      <h3 id="adjFormTitle">✏️ Log Adjustment</h3>
      <div class="form-group">
        <label>Additional Overtime Hours Claimed</label>
        <input type="number" id="addHours" min="0.5" max="200" step="0.5" placeholder="e.g. 8"/>
      </div>
      <div class="form-group">
        <label>Justification / Notes</label>
        <textarea id="adjNotes" placeholder="e.g. Verbal approval by Dr. X on 2026-06-15 for weekend on-call coverage."></textarea>
      </div>
      <div class="form-group">
        <label>Remarks <span style="font-weight:400;text-transform:none;letter-spacing:0;color:#94a3b8;">(optional)</span></label>
        <textarea id="adjRemarks" placeholder="Any additional remarks…" style="min-height:60px;"></textarea>
      </div>
      <button class="btn-green submit-btn" id="submitBtn" onclick="submitAdjustment()">✅ Submit Adjustment</button>
    </div>

  </div>

  <!-- Right panel: Log -->
  <div class="right-panel">
    <div class="card">
      <div class="log-header">
        <h3 id="logTitle">Adjustment Log</h3>
        <span class="log-summary" id="logSummary"></span>
      </div>
      <div class="table-wrap">
        <table class="adj-table">
          <thead>
            <tr>
              <th>Date / Time</th>
              <th>Badge</th>
              <th>Name</th>
              <th>Role</th>
              <th>+ Hours</th>
              <th>Notes</th>
              <th>Remarks</th>
              <th>Submitted By</th>
              <th class="no-print">Actions</th>
            </tr>
          </thead>
          <tbody id="logBody">
            <tr><td colspan="9" class="empty-log">Load a month to view adjustments.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<!-- Edit modal -->
<div id="editModal">
  <div class="edit-modal-box">
    <div class="edit-modal-header">
      <span>✏️ Edit Adjustment</span>
      <button onclick="closeEditModal()">✕</button>
    </div>
    <div class="edit-modal-body">
      <input type="hidden" id="editDocId"/>
      <div class="form-group">
        <label>Staff</label>
        <input type="text" id="editStaffName" readonly
          style="background:#f8fafc;color:#64748b;cursor:default;width:100%;"/>
      </div>
      <div class="form-group">
        <label>Additional Overtime Hours Claimed</label>
        <input type="number" id="editHours" min="0.5" max="200" step="0.5" style="width:100%;"/>
      </div>
      <div class="form-group">
        <label>Justification / Notes</label>
        <textarea id="editNotes" style="width:100%;min-height:80px;resize:vertical;"></textarea>
      </div>
      <div class="form-group">
        <label>Remarks <span style="font-weight:400;text-transform:none;letter-spacing:0;color:#94a3b8;">(optional)</span></label>
        <textarea id="editRemarks" style="width:100%;min-height:60px;resize:vertical;"></textarea>
      </div>
    </div>
    <div class="edit-modal-footer">
      <button class="btn-ghost" onclick="closeEditModal()">Cancel</button>
      <button class="btn-green" onclick="saveEdit()">💾 Save Changes</button>
    </div>
  </div>
</div>

<div class="status-message" id="statusBox"></div>

<!-- Firebase + page scripts -->
<script src="config.js"></script>
<script src="js/auth.js"></script>

<script type="module">
  import { initializeApp }   from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getFirestore, collection, getDocs, addDoc, doc, updateDoc, deleteDoc }
    from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey:            "AIzaSyDA9hjUxU_DlArK6UIOdfS0PavTgNsUBbw",
    authDomain:        "bcotrota.firebaseapp.com",
    projectId:         "bcotrota",
    storageBucket:     "bcotrota.firebasestorage.app",
    messagingSenderId: "659421824894",
    appId:             "1:659421824894:web:f0546879df8808491ad52f"
  };
  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);

  // ── Constants ─────────────────────────────────────────────────────────────
  const STAFF_KEY = 'BCOT_STAFF_RECORDS_V2';
  const ADJ_COLL  = 'ot_adjustments';

  // ── State ─────────────────────────────────────────────────────────────────
  let _foundStaff     = null;
  let _allAdjustments = [];
  let _logLoaded      = false;

  // ── Helpers ───────────────────────────────────────────────────────────────
  function _key() { return (window.BCOT_APP_KEY || '').trim(); }
  function adjDocRef(id) { return doc(db, 'bcot_overtime_secure', _key(), ADJ_COLL, id); }

  function showStatus(msg, ok = true) {
    const el = document.getElementById('statusBox');
    el.textContent = msg;
    el.className   = 'status-message ' + (ok ? 'status-ok' : 'status-err');
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.className = 'status-message'; }, ok ? 3500 : 5000);
  }

  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function fmtDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    return d.toLocaleDateString('en-GB',{ day:'2-digit', month:'short', year:'numeric' })
      + ' ' + d.toLocaleTimeString('en-GB',{ hour:'2-digit', minute:'2-digit' });
  }

  function currentMonth() { return Number(document.getElementById('monthSel').value); }
  function currentYear()  { return Number(document.getElementById('yearSel').value) || new Date().getFullYear(); }

  function getSubmitter() {
    try {
      const sess = JSON.parse(localStorage.getItem('BCOT_AUTH_SESSION_V1') || '{}');
      return [sess.nameTitle, sess.name].filter(Boolean).join(' ') || 'Staff';
    } catch { return 'Staff'; }
  }

  function getStaffRecords() {
    try { return JSON.parse(localStorage.getItem(STAFF_KEY) || '[]') || []; }
    catch { return []; }
  }

  // ── Staff Lookup ──────────────────────────────────────────────────────────
  function searchStaff() {
    const query = (document.getElementById('staffSearch').value || '').trim();
    if (!query) { showStatus('Enter a badge number or staff name to search.', false); return; }

    const records = getStaffRecords();
    let found = records.find(s => String(s.badge || '').trim() === query);
    if (!found) {
      const q = query.toLowerCase();
      found = records.find(s => (s.name || '').toLowerCase().includes(q));
    }

    const card = document.getElementById('staffCard');
    const form = document.getElementById('adjFormCard');

    if (!found) {
      card.style.display = 'block';
      card.innerHTML = `<div style="color:#dc2626;font-size:13px;padding:8px 0;">
        No staff found matching "<strong>${esc(query)}</strong>".
        Check the badge number or name and try again.
      </div>`;
      form.style.display = 'none';
      _foundStaff = null;
      return;
    }

    _foundStaff = found;
    renderStaffCard(found);
    form.style.display = 'block';
    resetForm();
  }

  function resetForm() {
    document.getElementById('addHours').value   = '';
    document.getElementById('adjNotes').value   = '';
    document.getElementById('adjRemarks').value = '';
    document.getElementById('adjFormTitle').textContent = '✏️ Log Adjustment';
    document.getElementById('submitBtn').textContent    = '✅ Submit Adjustment';
  }

  function renderStaffCard(s) {
    const month = currentMonth();
    const year  = currentYear();
    const existingHours = _allAdjustments
      .filter(a => String(a.badge) === String(s.badge) && a.month === month && a.year === year)
      .reduce((sum, a) => sum + (Number(a.additionalHours) || 0), 0);

    const areas = (s.area || '').split(',').map(x => x.trim()).filter(Boolean);
    const areaChips = areas.length
      ? areas.map(a => `<span class="area-chip">${esc(a)}</span>`).join(' ')
      : '<span style="color:#94a3b8;font-size:12px;">No area assigned</span>';

    const pillClass = existingHours > 0 ? 'ot-pill' : 'ot-pill none';
    const pillLabel = existingHours > 0
      ? `+${existingHours} hrs adjustment logged this month`
      : 'No adjustments logged this month';

    document.getElementById('staffCard').style.display = 'block';
    document.getElementById('staffCard').innerHTML = `
      <div class="sc-name">${esc(s.name)}</div>
      <div class="sc-row"><span class="sc-label">Badge</span><span>${esc(s.badge || '—')}</span></div>
      <div class="sc-row"><span class="sc-label">Role</span><span>${esc(s.role || '—')}</span></div>
      <div class="sc-row"><span class="sc-label">Areas</span><span>${areaChips}</span></div>
      <div><span class="${pillClass}">${pillLabel}</span></div>`;
  }

  // ── Submit Adjustment ─────────────────────────────────────────────────────
  async function submitAdjustment() {
    if (!_foundStaff) { showStatus('Search for a staff member first.', false); return; }
    const k = _key();
    if (!k) { showStatus('config.js not found — BCOT_APP_KEY missing.', false); return; }

    const hours   = parseFloat(document.getElementById('addHours').value);
    const notes   = document.getElementById('adjNotes').value.trim();
    const remarks = document.getElementById('adjRemarks').value.trim();

    if (!hours || hours <= 0) { showStatus('Enter a valid number of hours (> 0).', false); return; }
    if (!notes)               { showStatus('Notes / justification is required.', false); return; }

    const entry = {
      badge:           String(_foundStaff.badge || ''),
      staffName:       _foundStaff.name || '',
      role:            _foundStaff.role || '',
      area:            _foundStaff.area || '',
      month:           currentMonth(),
      year:            currentYear(),
      additionalHours: hours,
      notes,
      remarks,
      submittedBy:     getSubmitter(),
      submittedAt:     new Date().toISOString(),
    };

    try {
      const colRef = collection(db, 'bcot_overtime_secure', k, ADJ_COLL);
      const docRef = await addDoc(colRef, entry);
      entry._id = docRef.id;
      _allAdjustments.unshift(entry);
      renderLog();
      renderStaffCard(_foundStaff);
      resetForm();
      showStatus(`Adjustment of +${hours} hrs logged for ${_foundStaff.name} ✅`);
    } catch (e) {
      console.error(e);
      showStatus('Save failed: ' + (e?.message || e), false);
    }
  }

  // ── Edit ──────────────────────────────────────────────────────────────────
  function openEditModal(id) {
    const a = _allAdjustments.find(x => x._id === id);
    if (!a) return;
    document.getElementById('editDocId').value      = id;
    document.getElementById('editStaffName').value  = `${a.staffName || ''}  (${a.badge || ''})`;
    document.getElementById('editHours').value      = a.additionalHours || '';
    document.getElementById('editNotes').value      = a.notes   || '';
    document.getElementById('editRemarks').value    = a.remarks || '';
    document.getElementById('editModal').classList.add('show');
  }

  function closeEditModal() {
    document.getElementById('editModal').classList.remove('show');
  }

  async function saveEdit() {
    const id      = document.getElementById('editDocId').value;
    const hours   = parseFloat(document.getElementById('editHours').value);
    const notes   = document.getElementById('editNotes').value.trim();
    const remarks = document.getElementById('editRemarks').value.trim();

    if (!id)                  { showStatus('No record selected.', false); return; }
    if (!hours || hours <= 0) { showStatus('Enter a valid number of hours (> 0).', false); return; }
    if (!notes)               { showStatus('Notes / justification is required.', false); return; }

    try {
      await updateDoc(adjDocRef(id), {
        additionalHours: hours,
        notes,
        remarks,
        lastEditedBy: getSubmitter(),
        lastEditedAt: new Date().toISOString(),
      });
      const idx = _allAdjustments.findIndex(x => x._id === id);
      if (idx >= 0) {
        _allAdjustments[idx] = { ..._allAdjustments[idx], additionalHours: hours, notes, remarks };
      }
      closeEditModal();
      renderLog();
      if (_foundStaff) renderStaffCard(_foundStaff);
      showStatus('Adjustment updated ✅');
    } catch (e) {
      console.error(e);
      showStatus('Update failed: ' + (e?.message || e), false);
    }
  }

  // ── Delete ────────────────────────────────────────────────────────────────
  async function deleteAdjustment(id) {
    const a = _allAdjustments.find(x => x._id === id);
    if (!a) return;
    const confirmed = await window.BCOT_AUTH.confirm(
      `Delete the adjustment of +${a.additionalHours} hrs for ${a.staffName}?\nThis cannot be undone.`,
      { title: '🗑 Delete Adjustment', confirmLabel: 'Delete', confirmClass: 'btn-red' }
    );
    if (!confirmed) return;

    try {
      await deleteDoc(adjDocRef(id));
      _allAdjustments = _allAdjustments.filter(x => x._id !== id);
      renderLog();
      if (_foundStaff) renderStaffCard(_foundStaff);
      showStatus('Adjustment deleted.');
    } catch (e) {
      console.error(e);
      showStatus('Delete failed: ' + (e?.message || e), false);
    }
  }

  // ── Mark as Done ─────────────────────────────────────────────────────────
  async function toggleDone(id) {
    const a = _allAdjustments.find(x => x._id === id);
    if (!a) return;
    const nowDone = !a.done;
    try {
      await updateDoc(adjDocRef(id), {
        done:   nowDone,
        doneAt: nowDone ? new Date().toISOString() : null,
        doneBy: nowDone ? getSubmitter() : null,
      });
      a.done   = nowDone;
      a.doneAt = nowDone ? new Date().toISOString() : null;
      a.doneBy = nowDone ? getSubmitter() : null;
      renderLog();
      showStatus(nowDone ? 'Marked as done ✅' : 'Marked as pending.');
    } catch (e) {
      console.error(e);
      showStatus('Update failed: ' + (e?.message || e), false);
    }
  }

  // ── Log ───────────────────────────────────────────────────────────────────
  async function refreshLog() {
    const k = _key();
    if (!k) { showStatus('config.js not found.', false); return; }

    document.getElementById('logTitle').textContent = 'Adjustment Log — Loading…';
    document.getElementById('logBody').innerHTML =
      '<tr><td colspan="9" class="empty-log">Loading…</td></tr>';

    try {
      const colRef = collection(db, 'bcot_overtime_secure', k, ADJ_COLL);
      const snap   = await getDocs(colRef);
      _allAdjustments = [];
      snap.forEach(d => { _allAdjustments.push({ _id: d.id, ...d.data() }); });
      _allAdjustments.sort((a, b) => (b.submittedAt || '').localeCompare(a.submittedAt || ''));
      _logLoaded = true;
      renderLog();
      if (_foundStaff) renderStaffCard(_foundStaff);
    } catch (e) {
      console.error(e);
      showStatus('Failed to load adjustments: ' + (e?.message || e), false);
      document.getElementById('logTitle').textContent = 'Adjustment Log — Load Failed';
    }
  }

  function renderLog() {
    const month = currentMonth();
    const year  = currentYear();
    const rows  = _allAdjustments.filter(a => a.month === month && a.year === year);

    const monthName = new Date(year, month - 1, 1).toLocaleString('default', { month: 'long' });
    document.getElementById('logTitle').textContent = `Adjustment Log — ${monthName} ${year}`;

    const totalHrs = rows.reduce((s, a) => s + (Number(a.additionalHours) || 0), 0);
    document.getElementById('logSummary').textContent = rows.length
      ? `${rows.length} entr${rows.length === 1 ? 'y' : 'ies'} · +${totalHrs} hrs total`
      : '';

    const tbody = document.getElementById('logBody');
    if (!rows.length) {
      tbody.innerHTML = `<tr><td colspan="9" class="empty-log">
        No adjustments recorded for ${monthName} ${year}.
      </td></tr>`;
      return;
    }

    tbody.innerHTML = rows.map(a => `
      <tr class="${a.done ? 'done-row' : ''}">
        <td class="ts-cell">${fmtDate(a.submittedAt)}</td>
        <td style="white-space:nowrap;font-weight:700;">${esc(a.badge)}</td>
        <td style="white-space:nowrap;">${esc(a.staffName)}${a.done ? '<span class="done-chip">&#10003; Done</span>' : ''}</td>
        <td style="font-size:11px;color:#475569;">${esc(a.role)}</td>
        <td class="hours-cell">+${Number(a.additionalHours) || 0} hrs</td>
        <td class="notes-cell" title="${esc(a.notes)}">${esc(a.notes)}</td>
        <td class="remarks-cell" title="${esc(a.remarks)}">${esc(a.remarks) || '<span style="color:#cbd5e1;">—</span>'}</td>
        <td class="by-cell">${esc(a.submittedBy)}</td>
        <td class="no-print">
          <div class="action-btns">
            <button onclick="toggleDone('${esc(a._id)}')" class="${a.done ? 'btn-ghost' : 'btn-teal'}">${a.done ? '↩ Undo' : '✓ Done'}</button>
            <button onclick="openEditModal('${esc(a._id)}')" style="background:#1a4f8b;">✏️ Edit</button>
            <button onclick="deleteAdjustment('${esc(a._id)}')" class="btn-red">🗑</button>
          </div>
        </td>
      </tr>`).join('');
  }

  // ── Expose to HTML onclick handlers ───────────────────────────────────────
  window.searchStaff      = searchStaff;
  window.submitAdjustment = submitAdjustment;
  window.refreshLog       = refreshLog;
  window.openEditModal    = openEditModal;
  window.closeEditModal   = closeEditModal;
  window.saveEdit         = saveEdit;
  window.deleteAdjustment = deleteAdjustment;
  window.toggleDone       = toggleDone;

  document.getElementById('monthSel').addEventListener('change', () => {
    if (_logLoaded) renderLog();
    if (_foundStaff) renderStaffCard(_foundStaff);
  });
  document.getElementById('yearSel').addEventListener('change', () => {
    if (_logLoaded) renderLog();
    if (_foundStaff) renderStaffCard(_foundStaff);
  });

  // Close edit modal on backdrop click
  document.getElementById('editModal').addEventListener('click', e => {
    if (e.target === document.getElementById('editModal')) closeEditModal();
  });

  // ── Init: password gate (any user with the password) ─────────────────────
  async function init() {
    const pwd = (window.BCOT_OT_OVERRIDE_PASSWORD || '').trim();
    if (pwd) {
      const entered = await window.BCOT_AUTH.prompt(
        'Enter the password to access OT Adjustment & Disclosure.',
        { title: '🔑 OT Adjustment', placeholder: 'Password', type: 'password', confirmLabel: 'Enter' }
      );
      if (entered === null || entered.trim() !== pwd) {
        document.getElementById('authOverlay').innerHTML = `
          <div style="text-align:center;color:#dc2626;font-size:14px;">
            <div style="font-size:36px;margin-bottom:12px;">🚫</div>
            Incorrect password. Returning…
          </div>`;
        setTimeout(() => { window.location.href = 'index.html'; }, 1800);
        return;
      }
    }

    document.getElementById('authOverlay').style.display = 'none';
    document.getElementById('monthSel').value = String(new Date().getMonth() + 1);
    document.getElementById('yearSel').value  = String(new Date().getFullYear());

    await refreshLog();
  }

  init();
</script>
</body>
</html>
