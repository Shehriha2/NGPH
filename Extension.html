<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Staff Extension Requests — BCOT</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root{ --primary:#1a4f8b; --green:#16a34a; --red:#dc2626; --orange:#d97706; --purple:#7c3aed; --teal:#0f766e; --border:#e2e8f0; --bg:#f3f6fb; }
    *{ box-sizing:border-box; margin:0; padding:0; }
    body{ font-family:Arial,sans-serif; background:var(--bg); font-size:13px; color:#1f2937; min-height:100vh; }


    /* ── Form elements ── */
    .fg{ margin-bottom:14px; }
    .fg label{ display:block; font-weight:700; font-size:11px; color:#374151; margin-bottom:5px; text-transform:uppercase; letter-spacing:.3px; }
    .fg input,.fg select,.fg textarea{ width:100%; padding:9px 12px; border:1px solid var(--border); border-radius:8px; font-size:13px; font-family:Arial,sans-serif; outline:none; }
    .fg input:focus,.fg select:focus,.fg textarea:focus{ border-color:var(--primary); }
    .fg textarea{ resize:vertical; min-height:72px; }

    /* ── Buttons ── */
    .btn{ padding:9px 18px; border:none; border-radius:8px; font-weight:700; font-size:12px; cursor:pointer; }
    .btn:hover{ opacity:.87; }
    .btn-primary{ background:var(--primary); color:#fff; }
    .btn-full{ width:100%; }
    .btn-green{ background:var(--green); color:#fff; }
    .btn-red{ background:var(--red); color:#fff; }
    .btn-purple{ background:var(--purple); color:#fff; }
    .btn-teal{ background:var(--teal); color:#fff; }
    .btn-sm{ padding:5px 12px; font-size:11px; border-radius:6px; }
    .btn-outline{ background:transparent; border:1px solid var(--border); color:#374151; }

    /* ── App shell ── */
    .app-header{ background:linear-gradient(135deg,#1a4f8b 0%,#12335a 100%); color:#fff; padding:12px 20px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .app-header .title{ font-size:15px; font-weight:800; flex:1; }
    .role-badge{ padding:3px 12px; border-radius:20px; font-size:11px; font-weight:700; border:1.5px solid rgba(255,255,255,.45); }
    .app-nav{ background:#fff; border-bottom:1px solid var(--border); display:flex; overflow-x:auto; }
    .nav-tab{ padding:12px 20px; font-size:12px; font-weight:700; color:#6b7280; border-bottom:3px solid transparent; cursor:pointer; white-space:nowrap; background:none; border-top:none; border-left:none; border-right:none; }
    .nav-tab.active{ color:var(--primary); border-bottom-color:var(--primary); }
    .app-body{ padding:20px; max-width:980px; margin:0 auto; }

    /* ── Status badges ── */
    .badge{ display:inline-block; padding:2px 10px; border-radius:20px; font-size:10px; font-weight:700; text-transform:uppercase; }
    .b-pending{ background:#fef3c7; color:#92400e; }
    .b-mgr{ background:#dbeafe; color:#1e40af; }
    .b-granted{ background:#dcfce7; color:#15803d; }
    .b-cancelled{ background:#fee2e2; color:#991b1b; }

    /* ── Request cards ── */
    .req-card{ background:#fff; border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:12px; }
    .req-card-hdr{ display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
    .req-card-body{ font-size:12px; color:#374151; line-height:1.8; }
    .req-card-actions{ margin-top:12px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .staff-chip{ background:#eef2ff; color:#3730a3; border-radius:20px; padding:2px 10px; font-size:11px; font-weight:700; display:inline-block; margin:2px; }

    /* ── Staff checkbox grid ── */
    .staff-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:6px; max-height:190px; overflow-y:auto; border:1px solid var(--border); border-radius:8px; padding:10px; background:#fafafa; }
    .staff-item{ display:flex; align-items:center; gap:6px; font-size:12px; cursor:pointer; }

    /* ── Setup tables ── */
    .setup-table{ width:100%; border-collapse:collapse; background:#fff; border-radius:10px; border:1px solid var(--border); overflow:hidden; }
    .setup-table th{ background:#f1f5f9; padding:9px 12px; font-size:11px; text-align:left; color:#475569; font-weight:700; border-bottom:1px solid var(--border); }
    .setup-table td{ padding:9px 12px; font-size:12px; border-bottom:1px solid var(--border); }
    .setup-table tr:last-child td{ border-bottom:none; }

    /* ── Misc ── */
    .section-title{ font-size:14px; font-weight:800; color:var(--primary); margin-bottom:14px; }
    .empty-state{ text-align:center; padding:40px; color:#9ca3af; }
    .err-msg{ color:var(--red); font-size:12px; margin-top:8px; font-weight:700; display:none; }
    .ok-msg{ color:var(--green); font-size:12px; margin-top:8px; font-weight:700; display:none; }
    .hours-badge{ font-size:20px; font-weight:900; color:var(--primary); background:#eef2ff; border-radius:8px; padding:8px 14px; text-align:center; min-width:70px; }
    .wa-btn{ display:inline-flex; align-items:center; gap:5px; background:#25D366; color:#fff; padding:5px 12px; border-radius:6px; text-decoration:none; font-size:11px; font-weight:700; }
    .panel{ background:#fff; border:1px solid var(--border); border-radius:12px; padding:18px; margin-bottom:18px; }
    .panel-title{ font-weight:800; margin-bottom:12px; color:#1f2937; }
    .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .notice{ padding:12px 16px; border-radius:8px; font-size:12px; margin-bottom:14px; }
    .notice-green{ background:#dcfce7; color:#15803d; }
    .notice-red{ background:#fee2e2; color:#991b1b; }
    @media(max-width:600px){ .grid2{ grid-template-columns:1fr; } .app-body{ padding:12px; } }

    /* ── Report ── */
    .rpt-wrap{ background:#fff; padding:22px 28px 18px; border-radius:8px; border:1px solid var(--border); max-width:960px; }
    .rpt-header{ text-align:center; margin-bottom:18px; border-bottom:1px solid #e5e7eb; padding-bottom:14px; }
    .rpt-header .rpt-title{ font-size:15px; font-weight:900; text-transform:uppercase; letter-spacing:.5px; margin-bottom:4px; }
    .rpt-header .rpt-sub{ font-size:11.5px; color:#374151; line-height:1.8; }
    .rpt-header .rpt-meta{ display:flex; justify-content:center; gap:22px; flex-wrap:wrap; font-size:11px; color:#6b7280; margin-top:8px; }
    .rpt-table{ width:100%; border-collapse:collapse; border:1px solid #333; margin-top:4px; }
    .rpt-table th{ background:#ffd700; color:#000; font-weight:700; font-size:11px; border:1px solid #333; padding:5px 6px; text-align:center; line-height:1.3; }
    .rpt-table td{ border:1px solid #333; padding:4px 6px; font-size:11px; vertical-align:middle; }
    .rpt-table tfoot td{ background:#f8fafc; font-weight:700; }
    .rpt-controls{ background:#fff; border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:16px; }

    @media print{
      .app-header,.app-nav,.rpt-controls,.no-print{ display:none !important; }
      body{ background:#fff; padding:0; }
      .app-body{ padding:0; max-width:100%; }
      .rpt-wrap{ box-shadow:none; border:none; padding:0; max-width:100%; }
      .rpt-table th,.rpt-table td{ font-size:9pt; }
      *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
    }
  </style>
</head>
<body>

<!-- App shell -->
<div id="appShell" style="display:none">
  <div class="app-header">
    <div class="title"><i class="bi bi-clipboard-check"></i> Staff Extension Requests</div>
    <span class="role-badge" id="roleBadge"></span>
    <span id="userNameBadge" style="font-size:12px;opacity:.82;"></span>
    <button class="btn btn-sm btn-outline" onclick="BCOT_AUTH.doLogout()" style="border-color:rgba(255,255,255,.4);color:#fff;background:rgba(255,255,255,.1);">Logout</button>
    <a href="index.html" style="color:rgba(255,255,255,.7);font-size:11px;text-decoration:none;">← Rota</a>
  </div>
  <div class="app-nav" id="appNav"></div>
  <div class="app-body" id="appBody"></div>
</div>
