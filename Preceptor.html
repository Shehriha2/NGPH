<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Preceptor Portal — KAMC-WR</title>
  <style>
    :root{
      --navy:#1a4f8b; --teal:#0f766e; --green:#16a34a; --red:#dc2626;
      --amber:#d97706; --purple:#7c3aed;
      --bg:#f1f5f9; --card:#fff; --border:#e2e8f0; --muted:#64748b;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:Arial,sans-serif;background:var(--bg);color:#1e293b;font-size:13px;}

    /* ── Auth overlay ── */
    #authOverlay{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;}

    /* ── Top bar ── */
    .topbar{background:linear-gradient(135deg,var(--navy),var(--teal));color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.15);}
    .topbar-left .topbar-title{font-size:15px;font-weight:800;}
    .topbar-left .topbar-sub{font-size:11px;opacity:.8;margin-top:2px;}
    .topbar-right{display:flex;gap:7px;align-items:center;flex-wrap:wrap;}
    .topbar-name{font-size:13px;font-weight:700;opacity:.9;white-space:nowrap;}

    /* ── Buttons ── */
    button{cursor:pointer;border:none;border-radius:7px;font-size:12px;font-weight:700;padding:6px 13px;transition:background .15s;font-family:Arial,sans-serif;}
    .btn-primary{background:var(--navy);color:#fff;} .btn-primary:hover{background:#163e70;}
    .btn-teal{background:var(--teal);color:#fff;} .btn-teal:hover{background:#0b5c56;}
    .btn-green{background:var(--green);color:#fff;} .btn-green:hover{background:#15803d;}
    .btn-red{background:var(--red);color:#fff;} .btn-red:hover{background:#b91c1c;}
    .btn-ghost{background:#e2e8f0;color:#334155;} .btn-ghost:hover{background:#cbd5e1;}
    .btn-amber{background:var(--amber);color:#fff;} .btn-amber:hover{background:#b45309;}
    .btn-sm{padding:4px 10px;font-size:11px;}

    /* ── Layout ── */
    .page{max-width:1100px;margin:0 auto;padding:16px 14px;}
    .card{background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.09);border:1px solid var(--border);padding:18px 20px;margin-bottom:14px;}
    .card-title{font-size:14px;font-weight:800;color:var(--navy);margin-bottom:14px;border-bottom:2px solid var(--border);padding-bottom:8px;display:flex;align-items:center;justify-content:space-between;}

    /* ── Capacity ── */
    .cap-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
    .cap-chip{display:inline-flex;align-items:center;gap:5px;background:#f0f9ff;border:1px solid #bae6fd;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700;color:#0369a1;}
    .cap-chip.over{background:#fef2f2;border-color:#fca5a5;color:var(--red);}
    .cap-chip.near{background:#fffbeb;border-color:#fde68a;color:var(--amber);}

    /* ── Tabs ── */
    .tab-bar{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:14px;}
    .tab-btn{background:none;border:none;border-bottom:3px solid transparent;border-radius:0;padding:8px 18px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;margin-bottom:-2px;}
    .tab-btn.on{color:var(--navy);border-bottom-color:var(--navy);}

    /* ── Trainee cards ── */
    .tc{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px;background:#fff;transition:box-shadow .15s;}
    .tc:hover{box-shadow:0 2px 10px rgba(0,0,0,.09);}
    .tc-top{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap;}
    .tc-name{font-size:14px;font-weight:800;color:#0f172a;}
    .tc-meta{font-size:11px;color:var(--muted);margin-top:2px;}
    .tc-rot{background:#f8fafc;border-radius:8px;padding:10px 12px;margin-top:10px;border:1px solid #f1f5f9;}
    .tc-rot-name{font-size:13px;font-weight:700;color:#0f172a;}
    .tc-rot-dates{font-size:11px;color:var(--muted);margin-top:2px;}
    .tc-eval-row{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap;}
    .ebadge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:12px;border:1px solid;}
    .e-yes{background:#dcfce7;color:#166534;border-color:#86efac;}
    .e-no{background:#fef2f2;color:var(--red);border-color:#fca5a5;}
    .e-pend{background:#f1f5f9;color:var(--muted);border-color:var(--border);}
    .mark-b{font-size:12px;font-weight:800;color:var(--navy);}

    /* ── Availability ── */
    .unavail-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;background:#fafafa;}
    .unavail-dates{font-size:12px;font-weight:700;color:#0f172a;}
    .unavail-reason{font-size:11px;color:var(--muted);}

    /* ── Modal ── */
    .mbd{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:8000;}
    .mbd.show{display:flex;}
    .mbox{background:#fff;border-radius:14px;box-shadow:0 16px 48px rgba(0,0,0,.25);width:min(500px,96%);max-height:90vh;overflow-y:auto;}
    .mhd{padding:13px 18px;border-radius:14px 14px 0 0;display:flex;align-items:center;justify-content:space-between;color:#fff;}
    .mhd button{background:transparent;border:none;color:#fff;font-size:20px;cursor:pointer;padding:0 4px;}
    .mbody{padding:18px 20px;}
    .mft{padding:12px 20px 16px;border-top:1px solid #f3f4f6;display:flex;gap:8px;justify-content:flex-end;}
    .fg{margin-bottom:13px;}
    .fl{display:block;font-size:11px;font-weight:700;color:#374151;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px;}
    .fg input,.fg textarea,.fg select{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:7px;font-size:13px;font-family:Arial,sans-serif;outline:none;}
    .fg input:focus,.fg textarea:focus,.fg select:focus{border-color:var(--navy);box-shadow:0 0 0 2px rgba(26,79,139,.1);}
    .fg textarea{resize:vertical;min-height:70px;}
    .fr{display:flex;gap:12px;}
    .fr .fg{flex:1;}

    /* ── Status ── */
    #statusBox{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 22px;border-radius:10px;font-weight:700;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.18);display:none;z-index:9000;max-width:90vw;text-align:center;}

    /* ── Chips ── */
    .chip{display:inline-block;padding:2px 8px;border-radius:3px;font-size:11px;font-weight:600;white-space:nowrap;border:1px solid transparent;}
    .c-master{background:#ede9fe;color:#4c1d95;border-color:#c4b5fd;}
    .c-intern{background:#eff6ff;color:#1e40af;border-color:#93c5fd;}
    .c-r1{background:#d1fae5;color:#064e3b;border-color:#6ee7b7;}
    .c-r2{background:#fef3c7;color:#78350f;border-color:#fcd34d;}
    .c-r3{background:#fce7f3;color:#831843;border-color:#f9a8d4;}
    .c-summer-training{background:#fef9c3;color:#713f12;border-color:#fde047;}
    .c-collaborative-training{background:#ede9fe;color:#4c1d95;border-color:#c4b5fd;}
    .c-other{background:#f1f5f9;color:#334155;border-color:var(--border);}
    .c-active{background:#dcfce7;color:#166534;border-color:#86efac;}
    .c-upcoming{background:#eff6ff;color:#1e40af;border-color:#93c5fd;}
    .c-completed{background:#f1f5f9;color:var(--muted);border-color:var(--border);}

    .empty{text-align:center;padding:40px;color:var(--muted);font-size:13px;}
    @media(max-width:600px){.fr{flex-direction:column;}.topbar-right{gap:5px;}}
    @media print{.no-print{display:none!important;}}
  </style>
</head>
<body>

<!-- ── Auth Overlay ─────────────────────────────────────────────────────── -->
<div id="authOverlay">
  <div style="text-align:center;color:#64748b;font-family:Arial,sans-serif;">
    <div style="font-size:40px;margin-bottom:12px;">🎓</div>
    <div style="font-size:14px;" id="authMsg">Verifying access…</div>
  </div>
</div>

<!-- ── Main Content ──────────────────────────────────────────────────────── -->
<div id="mainContent" style="display:none;">

  <div class="topbar no-print">
    <div class="topbar-left">
      <div class="topbar-title">🎓 Preceptor Portal</div>
      <div class="topbar-sub" id="topbarSub">Pharmaceutical Care · KAMC-WR</div>
    </div>
    <div class="topbar-right">
      <span class="topbar-name" id="topbarName"></span>
      <a href="Training.html" style="text-decoration:none;"><button class="btn-ghost btn-sm">← Training</button></a>
      <button class="btn-red btn-sm" onclick="doLogout()">Sign Out</button>
    </div>
  </div>

  <div class="page">

    <!-- Capacity -->
    <div class="card">
      <div class="card-title"><span>My Capacity</span></div>
      <div class="cap-row" id="capSummary"><span style="color:#94a3b8;font-size:12px;">Loading…</span></div>
    </div>

    <!-- My Trainees -->
    <div class="card">
      <div class="card-title"><span>My Trainees</span></div>
      <div class="tab-bar no-print">
        <button class="tab-btn on" id="tabActive"     onclick="switchTab('active')">🟢 Active</button>
        <button class="tab-btn"    id="tabUpcoming"   onclick="switchTab('upcoming')">🔵 Upcoming</button>
        <button class="tab-btn"    id="tabCompleted"  onclick="switchTab('completed')">⬜ Completed</button>
      </div>
      <div id="traineeList"></div>
    </div>

    <!-- Availability -->
    <div class="card">
      <div class="card-title">
        <span>My Availability</span>
        <button class="btn-amber btn-sm no-print" onclick="openAddUnavail()">+ Add Unavailability</button>
      </div>
      <div id="unavailList"></div>
    </div>

  </div>
</div>

<!-- ── Modal: Edit Evaluation / Notes ───────────────────────────────────── -->
<div id="mEval" class="mbd">
  <div class="mbox">
    <div class="mhd" style="background:linear-gradient(135deg,var(--navy),var(--teal));">
      <span>✏️ Evaluate Rotation</span>
      <button onclick="closeModal('mEval')">&#x2715;</button>
    </div>
    <div class="mbody">
      <input type="hidden" id="evTid"/>
      <input type="hidden" id="evRidx"/>
      <div id="evInfo" style="background:#f8fafc;border-radius:8px;padding:10px 12px;font-size:12px;color:#374151;margin-bottom:14px;border:1px solid var(--border);"></div>
      <div class="fr">
        <div class="fg">
          <label class="fl">Evaluation Completed</label>
          <select id="evEval">
            <option value="">— Not set —</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
          </select>
        </div>
        <div class="fg">
          <label class="fl">Mark (out of 100)</label>
          <input type="number" id="evMark" min="0" max="100" step="1" placeholder="e.g. 85"/>
        </div>
      </div>
      <div class="fg">
        <label class="fl">Notes / Remarks</label>
        <textarea id="evNotes" placeholder="Any notes about this rotation…"></textarea>
      </div>
    </div>
    <div class="mft">
      <button class="btn-ghost" onclick="closeModal('mEval')">Cancel</button>
      <button class="btn-green" onclick="saveEval()">💾 Save</button>
    </div>
  </div>
</div>

<!-- ── Modal: Add Unavailability ────────────────────────────────────────── -->
<div id="mUnavail" class="mbd">
  <div class="mbox" style="width:min(440px,96%);">
    <div class="mhd" style="background:linear-gradient(135deg,var(--amber),#b45309);">
      <span>Add Unavailability Period</span>
      <button onclick="closeModal('mUnavail')">&#x2715;</button>
    </div>
    <div class="mbody">
      <div class="fr">
        <div class="fg"><label class="fl">From *</label><input type="date" id="uStart"/></div>
        <div class="fg"><label class="fl">To *</label><input type="date" id="uEnd"/></div>
      </div>
      <div class="fg">
        <label class="fl">Reason *</label>
        <select id="uReason">
          <option value="">— Select —</option>
          <option>Annual Leave</option>
          <option>Sick Leave</option>
          <option>Conference / Training</option>
          <option>Official Duty</option>
          <option>Other</option>
        </select>
      </div>
      <div class="fg">
        <label class="fl">Notes (optional)</label>
        <input type="text" id="uNotes" placeholder="Additional details…"/>
      </div>
    </div>
    <div class="mft">
      <button class="btn-ghost" onclick="closeModal('mUnavail')">Cancel</button>
      <button class="btn-amber" onclick="saveUnavail()">Save Period</button>
    </div>
  </div>
</div>

<div id="statusBox"></div>

<script src="config.js"></script>
<script src="js/version-check.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getFirestore, collection, getDocs, doc, updateDoc }
    from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  const app = initializeApp({
    apiKey:"AIzaSyDA9hjUxU_DlArK6UIOdfS0PavTgNsUBbw",
    authDomain:"bcotrota.firebaseapp.com", projectId:"bcotrota",
    storageBucket:"bcotrota.firebasestorage.app",
    messagingSenderId:"659421824894",
    appId:"1:659421824894:web:f0546879df8808491ad52f"
  });
  const db = getFirestore(app);

  // ── State ────────────────────────────────────────────────────────────────
  let _preceptors = [];
  let _trainees   = [];
  let _me         = null;
  let _tab        = 'active';

  const _key  = () => (window.BCOT_APP_KEY || '').trim();
  const pRef  = id => doc(db, 'bcot_overtime_secure', _key(), 'preceptors', id);
  const tRef  = id => doc(db, 'bcot_overtime_secure', _key(), 'trainees',   id);

  const TYPE_CLS = {
    Master:'c-master', Intern:'c-intern', R1:'c-r1', R2:'c-r2', R3:'c-r3',
    'Summer Training':'c-summer-training', 'Collaborative Training':'c-collaborative-training',
    Other:'c-other'
  };

  function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function fd(d) {
    if (!d) return '—';
    return new Date(d + 'T00:00:00').toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'});
  }

  function rstt(r) {
    const now = new Date().toISOString().slice(0, 10);
    if (r.endDate   < now) return 'completed';
    if (r.startDate > now) return 'upcoming';
    return 'active';
  }

  function dLeft(d) {
    if (!d) return null;
    return Math.ceil((new Date(d + 'T00:00:00') - new Date()) / 86400000);
  }

  function ss(msg, ok = true) {
    const el = document.getElementById('statusBox');
    el.textContent = msg;
    el.style.cssText = `display:block;background:${ok ? '#166534' : '#dc2626'};color:#fff;`;
    clearTimeout(el._t);
    el._t = setTimeout(() => el.style.display = 'none', ok ? 3200 : 5000);
  }

  window.closeModal = id => document.getElementById(id).classList.remove('show');

  // ── Load ─────────────────────────────────────────────────────────────────
  async function loadData() {
    const k = _key(); if (!k) return;
    const [ps, ts] = await Promise.all([
      getDocs(collection(db, 'bcot_overtime_secure', k, 'preceptors')),
      getDocs(collection(db, 'bcot_overtime_secure', k, 'trainees'))
    ]);
    _preceptors = []; ps.forEach(d => _preceptors.push({ _id: d.id, ...d.data() }));
    _trainees   = []; ts.forEach(d => _trainees.push({ _id: d.id, ...d.data() }));
    _preceptors.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
  }

  // ── Auth ─────────────────────────────────────────────────────────────────
  window.doLogout = function () {
    window.location.href = 'index.html';
  };

  function showDashboard() {
    document.getElementById('authOverlay').style.display  = 'none';
    document.getElementById('mainContent').style.display  = 'block';
    document.getElementById('topbarName').textContent     = _me.name;
    document.getElementById('topbarSub').textContent      =
      [_me.role, _me.area].filter(Boolean).join(' · ') || 'Pharmaceutical Care · KAMC-WR';
    renderCapacity();
    renderTrainees();
    renderAvailability();
  }

  // ── Tabs ─────────────────────────────────────────────────────────────────
  window.switchTab = function (tab) {
    _tab = tab;
    ['active', 'upcoming', 'completed'].forEach(t => {
      const btn = document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1));
      if (btn) btn.classList.toggle('on', t === tab);
    });
    renderTrainees();
  };

  // ── Capacity ─────────────────────────────────────────────────────────────
  function renderCapacity() {
    if (!_me) return;
    const load = {};
    _trainees.forEach(t => {
      (t.rotations || []).forEach(r => {
        if (r.preceptorId === _me._id && rstt(r) === 'active') {
          const type = t.type || 'Other';
          load[type] = (load[type] || 0) + 1;
        }
      });
    });
    const cap   = _me.capacity || {};
    const total = Object.values(load).reduce((s, n) => s + n, 0);
    const el    = document.getElementById('capSummary');

    if (!total && !Object.keys(cap).length) {
      el.innerHTML = '<span style="color:#94a3b8;font-size:12px;">No active trainees.</span>';
      return;
    }
    let html = `<span class="cap-chip"><strong>Active:</strong>&nbsp;${total}</span>`;
    Object.entries(load).forEach(([type, n]) => {
      const max = Number(cap[type] || 0);
      const cls = max && n >= max ? 'over' : max && n >= max * .75 ? 'near' : '';
      html += `<span class="cap-chip ${cls}">${esc(type)}: ${n}${max ? '/' + max : ''}</span>`;
    });
    el.innerHTML = html;
  }

  // ── Trainees ─────────────────────────────────────────────────────────────
  function renderTrainees() {
    if (!_me) return;
    const items = [];
    _trainees.forEach(t => {
      (t.rotations || []).forEach((r, i) => {
        if (r.preceptorId === _me._id && rstt(r) === _tab) items.push({ t, r, i });
      });
    });
    items.sort((a, b) => (a.r.startDate || '').localeCompare(b.r.startDate || ''));

    const el = document.getElementById('traineeList');
    if (!items.length) {
      el.innerHTML = `<div class="empty">No ${_tab} rotations under your supervision.</div>`;
      return;
    }

    el.innerHTML = items.map(({ t, r, i }) => {
      const st    = rstt(r);
      const d     = dLeft(r.endDate);
      const dlTx  = st === 'active' && d != null
        ? `<span style="font-size:11px;font-weight:700;color:${d <= 7 ? '#991b1b' : '#166534'};">${d > 0 ? d + 'd left' : 'ends today'}</span>` : '';
      const stLbl = st === 'active' ? 'Active' : st === 'upcoming' ? 'Upcoming' : 'Completed';
      const typCls = TYPE_CLS[t.type] || 'c-other';

      const evalHtml = r.evaluationCompleted
        ? `<span class="ebadge ${r.evaluationCompleted === 'Yes' ? 'e-yes' : 'e-no'}">Eval: ${esc(r.evaluationCompleted)}</span>`
        : `<span class="ebadge e-pend">Not evaluated</span>`;
      const markHtml  = r.mark != null ? `<span class="mark-b">Mark: ${r.mark}/100</span>` : '';
      const notesHtml = r.remarks ? `<div style="margin-top:6px;font-size:11px;color:#475569;font-style:italic;">"${esc(r.remarks)}"</div>` : '';

      return `<div class="tc">
        <div class="tc-top">
          <div style="flex:1;">
            <div class="tc-name">${esc(t.name)}</div>
            <div class="tc-meta">${esc(t.no || '—')}${t.university ? ' · ' + esc(t.university) : ''}</div>
          </div>
          <span class="chip ${typCls}">${esc(t.type || '—')}</span>
          <span class="chip c-${st}">${stLbl}</span>
          ${dlTx}
        </div>
        <div class="tc-rot">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;">
            <div>
              <div class="tc-rot-name">${esc(r.rotationName || '—')}</div>
              <div class="tc-rot-dates">${fd(r.startDate)} → ${fd(r.endDate)}</div>
            </div>
            <button class="btn-primary btn-sm no-print" onclick="openEvalModal('${esc(t._id)}',${i})">✏️ Evaluate</button>
          </div>
          <div class="tc-eval-row">${evalHtml}${markHtml}</div>
          ${notesHtml}
        </div>
      </div>`;
    }).join('');
  }

  // ── Eval modal ────────────────────────────────────────────────────────────
  window.openEvalModal = function (tid, ridx) {
    const t = _trainees.find(x => x._id === tid); if (!t) return;
    const r = (t.rotations || [])[ridx];           if (!r) return;
    document.getElementById('evTid').value  = tid;
    document.getElementById('evRidx').value = ridx;
    document.getElementById('evInfo').innerHTML =
      `<strong>${esc(t.name)}</strong> &nbsp;·&nbsp; ${esc(t.no || '—')}`
      + ` &nbsp;·&nbsp; <em>${esc(r.rotationName || '—')}</em>`
      + `<br><span style="color:var(--muted);">${fd(r.startDate)} → ${fd(r.endDate)}</span>`;
    document.getElementById('evEval').value  = r.evaluationCompleted || '';
    document.getElementById('evMark').value  = r.mark ?? '';
    document.getElementById('evNotes').value = r.remarks || '';
    document.getElementById('mEval').classList.add('show');
  };

  window.saveEval = async function () {
    const tid  = document.getElementById('evTid').value;
    const ridx = Number(document.getElementById('evRidx').value);
    const t    = _trainees.find(x => x._id === tid); if (!t) return;
    const rots = [...(t.rotations || [])];
    const r    = { ...rots[ridx] };
    r.evaluationCompleted = document.getElementById('evEval').value;
    const mv = document.getElementById('evMark').value;
    r.mark    = mv !== '' ? Number(mv) : null;
    r.remarks = document.getElementById('evNotes').value.trim();
    rots[ridx] = r;
    try {
      await updateDoc(tRef(tid), { rotations: rots });
      t.rotations = rots;
      window.closeModal('mEval');
      renderTrainees();
      ss('Evaluation saved ✅');
    } catch (e) { ss('Save failed: ' + (e?.message || e), false); }
  };

  // ── Availability ──────────────────────────────────────────────────────────
  function renderAvailability() {
    if (!_me) return;
    const list = (_me.unavailability || []).filter(u => u.id !== 'auto_capacity');
    const el   = document.getElementById('unavailList');
    if (!list.length) {
      el.innerHTML = '<div style="color:#94a3b8;font-size:12px;padding:6px 0;">No unavailability periods recorded.</div>';
      return;
    }
    list.sort((a, b) => (a.startDate || '').localeCompare(b.startDate || ''));
    el.innerHTML = list.map(u => `
      <div class="unavail-item">
        <div style="flex:1;">
          <div class="unavail-dates">${fd(u.startDate)} → ${fd(u.endDate)}</div>
          <div class="unavail-reason">${esc(u.reason)}${u.notes ? ' · ' + esc(u.notes) : ''}</div>
        </div>
        <button class="btn-red btn-sm no-print" onclick="removeUnavail('${esc(u.id)}')">Remove</button>
      </div>`).join('');
  }

  window.openAddUnavail = function () {
    ['uStart', 'uEnd', 'uNotes'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('uReason').value = '';
    document.getElementById('mUnavail').classList.add('show');
    setTimeout(() => document.getElementById('uStart').focus(), 100);
  };

  window.saveUnavail = async function () {
    const sd = document.getElementById('uStart').value;
    const ed = document.getElementById('uEnd').value;
    const rs = document.getElementById('uReason').value;
    const nt = document.getElementById('uNotes').value.trim();
    if (!sd || !ed) { ss('Start and end dates are required.', false); return; }
    if (ed < sd)    { ss('End date must be after start date.', false); return; }
    if (!rs)        { ss('Please select a reason.', false); return; }
    const entry    = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), startDate: sd, endDate: ed, reason: rs, notes: nt };
    const newList  = [...(_me.unavailability || []), entry];
    try {
      await updateDoc(pRef(_me._id), { unavailability: newList });
      _me.unavailability = newList;
      window.closeModal('mUnavail');
      renderAvailability();
      ss('Unavailability saved ✅');
    } catch (e) { ss('Save failed: ' + (e?.message || e), false); }
  };

  window.removeUnavail = async function (uid) {
    const newList = (_me.unavailability || []).filter(u => u.id !== uid);
    try {
      await updateDoc(pRef(_me._id), { unavailability: newList });
      _me.unavailability = newList;
      renderAvailability();
      ss('Period removed.');
    } catch (e) { ss('Remove failed: ' + (e?.message || e), false); }
  };

  // ── Init ─────────────────────────────────────────────────────────────────
  async function init() {
    // Check main app session
    let badge = null, sessName = null;
    try {
      const s = JSON.parse(localStorage.getItem('BCOT_AUTH_SESSION_V1') || '{}');
      if (!s.ts || Date.now() - s.ts > 43200000) {
        window.location.href = 'index.html'; return;
      }
      badge    = String(s.badge || '').trim();
      sessName = String(s.name  || '').trim().toLowerCase();
    } catch {
      window.location.href = 'index.html'; return;
    }

    // Load Firebase data
    try {
      await loadData();
    } catch (e) {
      document.getElementById('authMsg').textContent = 'Failed to load data. Check connection.';
      console.error(e); return;
    }

    // Match by badge first, fall back to name
    const match = _preceptors.find(p => p.active !== false && (
      (badge    && String(p.badge || '').trim() === badge) ||
      (sessName && String(p.name  || '').trim().toLowerCase() === sessName)
    ));

    if (match) {
      _me = match;
      showDashboard();
    } else {
      document.getElementById('authOverlay').innerHTML = `
        <div style="text-align:center;font-family:Arial,sans-serif;">
          <div style="font-size:48px;margin-bottom:14px;">🎓</div>
          <div style="font-size:15px;font-weight:700;color:#1e293b;margin-bottom:6px;">Not Registered as Preceptor</div>
          <div style="font-size:13px;color:#64748b;margin-bottom:18px;">Your account is not linked to a preceptor record.<br>Contact the Training Coordinator to be added.</div>
          <a href="Training.html" style="background:#1a4f8b;color:#fff;text-decoration:none;padding:9px 22px;border-radius:8px;font-weight:700;font-size:13px;">← Back to Training</a>
        </div>`;
    }
  }

  init();
</script>
</body>
</html>
