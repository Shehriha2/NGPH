<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <style>html{visibility:hidden}</style>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Overtime Justification (Non-Physicians)</title>
  <style>
    :root{ --primary:#1a4f8b; --secondary:#2e8b57; }
    body{ margin:0; padding:12px; font-family:Arial,sans-serif; background:#f5f5f5; font-size:12px; }

    /* ── Controls bar (no-print) ── */
    .controls-bar{
      background:#fff; border-radius:10px; box-shadow:0 1px 4px rgba(0,0,0,.12);
      padding:12px 16px; margin-bottom:14px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;
    }
    .controls-bar label{ font-weight:700; color:#334155; white-space:nowrap; }
    input,select,button{ padding:6px 10px; border:1px solid #ddd; border-radius:6px; font-size:12px; }
    button{ background:var(--primary); color:#fff; border:none; cursor:pointer; font-weight:700; }
    button:hover{ background:var(--secondary); }
    .btn-green{ background:#28a745; } .btn-green:hover{ background:#218838; }
    .btn-orange{ background:#d97706; } .btn-orange:hover{ background:#b45309; }

    /* ── Form wrapper ── */
    .form-wrapper{
      background:#fff; padding:20px 28px 16px; border-radius:6px;
      box-shadow:0 1px 6px rgba(0,0,0,.1); max-width:960px; margin:0 auto;
    }

    /* ── Page section: one employee per page ── */
    .print-page{ }
    .print-page.page-break-after{
      border-bottom:3px dashed #cbd5e1;
      margin-bottom:32px;
      padding-bottom:24px;
    }

    /* ── Title block ── */
    .form-title{ text-align:center; margin-bottom:14px; }
    .form-title .main-title{ font-size:14px; font-weight:900; text-transform:uppercase; letter-spacing:.4px; margin-bottom:4px; }
    .form-title .sub-title{ font-size:12.5px; font-weight:400; line-height:1.7; }

    /* ── Meta fields ── */
    .meta-section{ margin-bottom:10px; }
    .meta-row{
      display:grid; grid-template-columns:1fr 1fr; gap:0 20px;
      margin-bottom:5px; align-items:baseline;
    }
    .meta-row3{
      display:grid; grid-template-columns:2fr 1fr 1fr; gap:0 14px;
      margin-bottom:5px; align-items:baseline;
    }
    .meta-cell{ display:flex; align-items:baseline; gap:5px; font-size:11px; }
    .meta-cell b{ white-space:nowrap; font-weight:700; }
    .meta-cell .meta-val{
      flex:1; border:none; border-bottom:1px solid #333; border-radius:0;
      padding:1px 4px; font-size:11px; font-family:Arial,sans-serif;
      background:transparent; outline:none; min-width:50px;
    }
    .meta-cell .meta-val:focus{ background:#fffde7; }

    /* ── Day table ── */
    .day-table{ width:100%; border-collapse:collapse; border:1px solid #333; margin-top:6px; table-layout:fixed; }
    .day-table th{
      background:#ffd700; color:#000; font-weight:700; font-size:9px;
      border:1px solid #333; padding:3px 2px; text-align:center; line-height:1.25;
    }
    .day-table td{
      border:1px solid #333; padding:2px 3px; font-size:9.5px; vertical-align:middle; text-align:center;
    }
    .day-table td.just{ text-align:left; font-size:9px; }
    .day-table td.just input,
    .day-table td input.cell-in{
      width:100%; border:none; background:transparent; font-size:9.5px; text-align:center;
      font-family:Arial,sans-serif; outline:none; padding:0;
    }
    .day-table td.just input{ text-align:left; }
    .day-table td input:focus{ background:#fffde7; }
    .total-row td{ font-weight:700; font-size:9.5px; background:#f8fafc; }

    /* ── Signature section — 3 approvers ── */
    .sig-wrapper{
      margin-top:16px;
      break-inside:avoid;
      page-break-inside:avoid;
    }
    .sig-row1{
      display:grid; grid-template-columns:1fr 1fr; gap:40px; align-items:start;
      margin-bottom:16px;
    }
    .sig-row2{ display:flex; justify-content:center; margin-bottom:8px; }
    .sig-row2 .sig-block{ min-width:220px; }
    .sig-block{ font-size:10.5px; line-height:1.8; }
    .sig-label{ font-weight:400; margin-bottom:0; line-height:1.6; min-height:44px; display:block; }
    .sig-line{ border-bottom:1px solid #333; margin:0 0 6px; }
    .sig-field{ display:flex; gap:4px; align-items:baseline; font-size:10.5px; line-height:1.8; }
    .sig-field .sf-key{ white-space:nowrap; min-width:52px; font-weight:400; }
    .sig-block input[type="text"]{
      flex:1; border:none; border-bottom:1px solid transparent; border-radius:0;
      padding:1px 3px; font-size:10.5px; font-family:Arial,sans-serif;
      background:transparent; outline:none;
    }
    .sig-block input[type="text"]:focus{ background:#fffde7; border-bottom-color:#aaa; }
    .sig-footnote{ font-size:8.5px; color:#555; font-style:italic; line-height:1.4; margin-top:4px; }

    /* ── Part II / Part III sections ── */
    .part-section{ margin-top:14px; break-inside:avoid; page-break-inside:avoid; }
    .part-title{
      background:#e2e8f0; font-weight:700; font-size:10px; padding:4px 8px;
      border:1px solid #333; border-bottom:none;
    }
    .part-table{ width:100%; border-collapse:collapse; border:1px solid #333; }
    .part-table td{ border:1px solid #333; padding:4px 6px; font-size:9.5px; vertical-align:top; }
    .part-table td b{ display:block; font-size:8.5px; color:#555; font-weight:700; margin-bottom:2px; }
    .part-table input[type="text"]{
      width:100%; border:none; border-bottom:1px solid #ccc; background:transparent;
      font-size:10px; font-family:Arial,sans-serif; outline:none; padding:1px 2px;
    }
    .part-table input[type="text"]:focus{ background:#fffde7; }

    /* ── Footer ── */
    .form-footer{
      display:flex; align-items:baseline;
      margin-top:14px; font-size:8pt; color:#666;
      border-top:1px solid #e5e7eb; padding-top:5px;
    }
    .ff-left  { flex:1; text-align:left; }
    .ff-center{ flex:1; text-align:center; font-size:7.5pt; color:#aaa; }
    .ff-right { flex:1; text-align:right; }

    /* ── Status ── */
    .status-message{
      position:fixed; top:14px; right:14px; padding:10px 16px; border-radius:6px;
      color:#fff; display:none; z-index:999; font-size:12px; font-weight:700;
    }
    .status-ok{ background:#28a745; } .status-err{ background:#dc3545; }

    /* ── PRINT ── */
    @media print{
      @page{ size:A4 portrait; margin:12mm 10mm 12mm 10mm; }
      body{ background:#fff; padding:0; }
      .controls-bar{ display:none !important; }
      .form-wrapper{ box-shadow:none; padding:0; max-width:100%; border-radius:0; }

      .print-page.page-break-after{
        page-break-after:always;
        border-bottom:none;
        margin-bottom:0;
        padding-bottom:0;
      }

      .form-title .main-title{ font-size:12.5pt; }
      .form-title .sub-title{ font-size:10pt; }
      .meta-cell{ font-size:8.5pt; }
      .meta-cell .meta-val{ border-bottom:1px solid #333 !important; }
      .day-table th, .day-table td{ font-size:7.5pt; }
      .sig-block, .sig-field{ font-size:9pt; }
      .sig-block input[type="text"]{ border-bottom:none !important; }
      .sig-label{ min-height:16mm; }
      .part-table input[type="text"]{ border-bottom:none !important; }
      *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
    }
  </style>
</head>
<body>

<!-- Controls bar -->

<!-- Form wrapper — rebuilt by buildForm() each time data is loaded -->
<div class="form-wrapper" id="formWrapper">
  <div class="form-title">

  <div style="text-align:center;color:#888;padding:30px;">

  </div>
</div>

<div class="status-message" id="statusBox"></div>
